version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nextgen-postgres
    restart: always
    environment:
      POSTGRES_DB: nextgen_bank
      POSTGRES_USER: bank_admin
      POSTGRES_PASSWORD: bank_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_admin -d nextgen_bank"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: nextgen_postgres_data
